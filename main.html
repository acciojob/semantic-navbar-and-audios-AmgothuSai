<!DOCTYPE html>
<html lang="en">
   <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Navbar & Audios</title>
   </head>
   <body>
    <nav>
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>
    <main>
        <section id="home">
            <h1>Welcome to My Website</h1>
            <p>This is the home section.</p>
        </section>
        <section id="about">
            <h2>About</h2>
            <p>Welcome to my audio webpage.</p>
        </section>
        <section id="contact">
            <h2>3 Random Audios</h2>
            <div>
                <audio controls src="https://commondatastorage.googleapis.com/codeskulptor-demos/DDR_assets/Kangaroo_MusiQue_-_The_Neverwritten_Role_Playing_Game.mp3">
                    Your browser does not support audio.
                    </audio>
            </div>
            <div>
                <audio controls src="https://commondatastorage.googleapis.com/codeskulptor-assets/Epoq-Lepidoptera.ogg">
                    Your browser does not support audio.
                </audio>
            </div>
            <div>
                <audio controls src="https://codeskulptor-demos.commondatastorage.googleapis.com/pang/paza-moduless.mp3">
                    Your browser does not support audio.
                </audio>
            </div>
        </section>
    </main>
   </body>
</html>
